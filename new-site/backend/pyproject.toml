[project]
name = "wk-select-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3", "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1", "authlib>=1.3,<2", "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.18,<1", "boto3>=1.35,<2",
  "bleach[css]>=6.1,<7", "Pillow>=11,<13", "defusedxml>=0.7,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
