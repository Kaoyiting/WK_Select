<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8f6ea"/><rect x="25" y="25" width="1150" height="670" rx="35" fill="none" stroke="#d7d1bf" stroke-width="2"/><g font-family="Arial, Microsoft JhengHei, sans-serif" text-anchor="middle"><text x="600" y="90" font-size="24" letter-spacing="5" fill="#333">WK.SELECT</text><rect x="365" y="120" width="470" height="80" rx="40" fill="#961b1b"/><text x="600" y="173" font-size="38" font-weight="bold" fill="white">反詐騙提醒</text><text x="600" y="270" font-size="28" fill="#333">我們不會主動致電要求您</text><text x="600" y="350" font-size="38" font-weight="bold" fill="#961b1b">操作 ATM 或網路銀行</text><text x="600" y="415" font-size="38" font-weight="bold" fill="#961b1b">提供信用卡密碼或驗證碼</text><text x="600" y="485" font-size="23" fill="#555">遇到訂單異常、重複扣款或解除分期等說法，請先停止操作</text><rect x="170" y="540" width="860" height="70" rx="35" fill="#961b1b"/><text x="600" y="585" font-size="28" fill="white">有疑慮請聯絡官方客服，或撥打 165 反詐騙專線</text><text x="600" y="654" font-size="20" fill="#555">保護個人資訊，確認後再行動</text></g></svg>